<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E37A0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MPI">
<link rel="icon" href="img/icone-64.png">
<title>MPI · Marketing Produção Innovar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>:root{
  --pri:#1446C8; --pri-clara:#9DB8FF; --sec:#0E37A0; --escura:#0A1E57; --fundo:#F4F6FB;
  --texto:#0F172A; --suave:#64748B; --borda:#DCE3EE; --branco:#fff;
  --ok:#16A34A; --alerta:#D97706; --erro:#DC2626;
  --raio:12px; --sombra:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sec)}
.oculto{display:none!important}

/* ---------- Acesso (login) ---------- */
.acesso{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.acesso-marca{background:radial-gradient(1100px 600px at -10% -20%,#1F5BE0 0,transparent 60%),linear-gradient(160deg,#0E37A0,var(--escura));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.acesso-marca h1{font-size:40px;line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}
.acesso-marca p{color:#C8D6EA;max-width:440px;margin:0}
.selo{display:inline-flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.selo .logo{width:40px;height:40px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;white-space:nowrap;letter-spacing:-.02em;flex:none}
.selo small{display:block;font-weight:500;font-size:12px;color:#8FA3BF}
.selo .logo b{color:var(--escura)}
.lista-recursos{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px;color:#E2EAF5}
.lista-recursos li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pri-clara);margin-right:10px;vertical-align:middle}
.rodape-marca{font-size:13px;color:#8FA3BF}
.acesso-form{display:grid;place-items:center;padding:32px}
.cartao-form{width:100%;max-width:400px}
.cartao-form h2{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.cartao-form .sub{color:var(--suave);margin:0 0 24px}
.campo{display:grid;gap:6px;margin-bottom:14px}
.campo label{font-size:13px;font-weight:600;color:#334155}
.campo input,.campo select{height:44px;border:1px solid var(--borda);border-radius:10px;padding:0 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.campo input:focus,.campo select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(20,70,200,.18)}
.ajuda{font-size:12px;color:var(--suave)}
.btn{height:44px;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{filter:brightness(.95)}
.btn-sec{background:#fff;border:1px solid var(--borda);color:var(--texto)}
.btn-perigo{background:#fff;border:1px solid #F3C2C2;color:var(--erro)}
.btn-bloco{width:100%}
.btn-peq{height:34px;padding:0 12px;font-size:13px}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}
.links button{background:none;border:0;color:var(--sec);cursor:pointer;padding:0;font-weight:500}
.aviso{border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.aviso-erro{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.aviso-ok{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
.aviso-info{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}

/* ---------- Estrutura do app ---------- */
.casca{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.lateral{background:var(--escura);color:#C8D6EA;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.lateral .selo{color:#fff;padding:4px 8px 18px}
.lateral .selo small{display:block;font-weight:500;color:#8FA3BF;font-size:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#C8D6EA;background:none;border:0;width:100%;text-align:left;cursor:pointer;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.ativo{background:rgba(20,70,200,.18);color:#fff}
.nav-item .ic{width:20px;text-align:center;opacity:.9}
.nav-item .etq{margin-left:auto;font-size:10px;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:999px;color:#8FA3BF}
.lateral .rodape{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;font-size:13px}
.usuario{display:flex;align-items:center;gap:10px;padding:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.usuario b{color:#fff;display:block;font-size:14px}
.principal{min-width:0}
.topo{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:5}
.topo h1{font-size:18px;margin:0}
.empresa-tag{font-size:13px;color:var(--suave);display:flex;align-items:center;gap:8px}
.empresa-tag .pt{width:8px;height:8px;border-radius:50%;background:var(--pri)}
.conteudo{padding:28px;max-width:1200px}
.grade{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.painel{min-width:0;background:#fff;border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra);padding:20px}
.painel h3{margin:0 0 4px;font-size:16px}
.painel .sub{color:var(--suave);font-size:13px;margin:0 0 16px}
.boas-vindas{background:linear-gradient(120deg,var(--escura),#0D2C7A);color:#fff;border:0}
.boas-vindas h2{margin:0 0 6px;font-size:22px}
.boas-vindas p{margin:0;color:#C8D6EA}
.modulo{display:flex;flex-direction:column;gap:8px}
.modulo .topo-mod{display:flex;justify-content:space-between;align-items:center}
.modulo .ic-mod{width:38px;height:38px;border-radius:10px;background:rgba(20,70,200,.12);display:grid;place-items:center;font-size:18px}
.etiqueta{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#F1F5F9;color:var(--suave);white-space:nowrap}
.etiqueta.ok{background:#DCFCE7;color:#166534}
.etiqueta.pri{background:rgba(20,70,200,.12);color:#036A7D}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--borda)}
.tabela td{padding:10px 8px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
.tabela select,.tabela input{height:34px;border:1px solid var(--borda);border-radius:8px;padding:0 8px;background:#fff;max-width:100%}
.rolagem{overflow-x:auto}
.linha-form{display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr auto;gap:10px;align-items:end}
.linha-form .campo{margin:0;min-width:0}
.linha-form input,.linha-form select{width:100%}
.vazio{color:var(--suave);text-align:center;padding:24px}
.chave{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--suave)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--escura);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--sombra);z-index:50;font-size:14px;max-width:92vw}
.carregando{min-height:100vh;display:grid;place-items:center;color:var(--suave)}
.giro{width:28px;height:28px;border:3px solid var(--borda);border-top-color:var(--pri);border-radius:50%;animation:g 1s linear infinite;margin:0 auto 12px}
@keyframes g{to{transform:rotate(360deg)}}
.menu-cel{display:none}


/* ================= Componentes da operação ================= */
.sem-rolagem{overflow:hidden}
.logo-img{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
textarea{border:1px solid var(--borda);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(20,70,200,.18)}
.campo textarea{min-height:44px}
.pre{white-space:pre-wrap}
.link{background:none;border:0;color:var(--sec);cursor:pointer;font-weight:600;padding:0;text-decoration:underline}
.contador{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#EEF2F7;color:var(--suave);font-size:12px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:#F1F5F9;color:#475569}
.chip-ok{background:#DCFCE7;color:#166534}.chip-alerta{background:#FEF3C7;color:#92400E}.chip-erro{background:#FEE2E2;color:#991B1B}
.chip-info{background:#DBEAFE;color:#1E40AF}.chip-neutro{background:#F1F5F9;color:#475569}
.barra-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.barra-acoes select,.barra-acoes input{height:40px;border:1px solid var(--borda);border-radius:10px;padding:0 10px;background:#fff}
.busca{flex:1;min-width:220px}
.grupo-btn{display:inline-flex;gap:4px}
.titulo-periodo{font-size:16px;text-transform:capitalize;min-width:170px}
.tabela-click tbody tr{cursor:pointer}.tabela-click tbody tr:hover{background:#F8FAFC}
.mini-capa{width:44px;height:44px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:#EEF2F7;color:var(--suave);flex:none}
.grade-campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px;align-items:end}
.campo-largo{grid-column:1/-1}
.rodape-form{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:16px;overflow-x:auto}
.aba{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--suave);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.aba.ativa{color:var(--texto);border-color:var(--pri)}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcao{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borda);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff}
.arquivo{display:inline-flex;align-items:center;gap:10px;border:2px dashed var(--borda);border-radius:12px;padding:22px;cursor:pointer;width:100%;justify-content:center;font-weight:600;color:var(--sec);margin:8px 0 12px}
.arquivo input{display:none}
.lista-simples>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF2F7}
.linha-mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.linha-mini input,.linha-mini select{height:36px;border:1px solid var(--borda);border-radius:8px;padding:0 10px;background:#fff;flex:1;min-width:140px}
.linha-mini input[type=checkbox]{flex:none;min-width:0;width:18px;height:18px;padding:0}
.linha-mini .chave{flex:none}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--suave);font-size:13px}
.kpi-alerta{border-color:#FECACA;background:#FEF2F2}.kpi-alerta b{color:var(--erro)}
.grade-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.grade-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}

/* Janela */
.janela-fundo{position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.janela{background:#fff;border-radius:16px;width:100%;min-width:0;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:sobe .15s ease-out}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.janela-topo{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--borda);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.janela-topo h2{margin:0;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fechar{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--suave);flex:none;width:40px;height:40px;margin-right:-8px}
.janela-corpo{padding:20px 22px 24px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:14px 0}
.dl dt{color:var(--suave);font-size:13px}.dl dd{margin:0}
.acoes-det{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#acao-extra:not(:empty){border-top:1px solid var(--borda);padding-top:14px;margin-top:10px}

/* Agenda */
.agenda-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.agenda-layout aside h3{font-size:14px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--suave);margin-bottom:10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda span::before{content:"";width:12px;height:12px;border-radius:3px;display:inline-block}
.legenda .ev-livre::before{background:#fff;border:1px solid var(--borda)}
.ev-pre{--c:#D97706}.ev-conf{--c:#0097B2}.ev-bloq{--c:#64748B}
.legenda .ev-pre::before,.legenda .ev-conf::before,.legenda .ev-bloq::before{background:var(--c)}
.semana{display:grid;min-width:640px;position:relative}
.sem-cab{padding:10px 8px;text-align:center;border-bottom:1px solid var(--borda);font-size:13px;color:var(--suave);position:sticky;top:0;background:#fff;z-index:2}
.sem-cab b{font-size:18px;color:var(--texto);display:block}.sem-cab.hoje b{color:var(--pri)}
.sem-cab .ajuda{display:block;font-size:10px}
.sem-horas{position:relative;border-right:1px solid var(--borda)}
.sem-horas span{position:absolute;right:6px;font-size:11px;color:var(--suave);transform:translateY(-6px)}
.sem-col{position:relative;border-right:1px solid #EEF2F7;background:repeating-linear-gradient(#fff 0 35px,#EEF2F7 35px 36px);cursor:copy}
.sem-col.fechado{background:repeating-linear-gradient(45deg,#F8FAFC 0 8px,#EEF2F7 8px 16px);cursor:not-allowed}
.almoco{position:absolute;left:0;right:0;background:rgba(100,116,139,.08);font-size:10px;color:var(--suave);text-align:center;pointer-events:none}
.evento{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:8px;padding:4px 6px;text-align:left;font-size:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;z-index:1}
.evento.ev-pre{background:repeating-linear-gradient(45deg,#FFFBEB 0 6px,#FEF3C7 6px 12px)}
.evento.ev-bloq{background:#F1F5F9;color:#475569}
.evento.meu{box-shadow:inset 0 0 0 2px var(--c)}
.evento span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mes{display:grid;grid-template-columns:repeat(7,1fr)}
.mes-cab{padding:8px;text-align:center;font-size:12px;color:var(--suave);border-bottom:1px solid var(--borda)}
.mes-dia{min-height:96px;border:0;border-right:1px solid #EEF2F7;border-bottom:1px solid #EEF2F7;background:#fff;text-align:left;padding:6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden}
.mes-dia .n{font-weight:600}.mes-dia.hoje .n{color:var(--pri)}.mes-dia.fora{opacity:.45}.mes-dia.fechado{background:#F8FAFC}
.mes-ev{font-size:11px;border-left:3px solid var(--c);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista-dia{padding:12px;display:grid;gap:8px}
.item-dia,.item-sol,.item-radar,.item-prod{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid var(--borda);border-radius:10px;padding:10px 12px;cursor:pointer}
.item-dia{flex-direction:column;align-items:flex-start;border-left:4px solid var(--c)}
.item-sol{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:8px}
.item-sol:hover,.item-radar:hover,.item-prod:hover{border-color:var(--pri)}
.slots-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:8px 0 14px}
.slot{height:38px;border:1px solid var(--borda);border-radius:8px;background:#fff;font-weight:600;cursor:pointer}
.slot:hover{border-color:var(--pri)}.slot.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.slot.ocupado{background:#F1F5F9;color:#CBD5E1;text-decoration:line-through;cursor:not-allowed}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start;scroll-snap-type:x proximity}
.coluna{background:#EEF2F7;border-radius:12px;padding:10px;scroll-snap-align:start;max-height:calc(100vh - 200px);display:flex;flex-direction:column}
.coluna header{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-size:14px}
.coluna header .pt{width:10px;height:10px;border-radius:3px;flex:none}
.coluna-bloq{background:#FEF2F2}
.lista-cartoes{display:flex;flex-direction:column;gap:8px;min-height:60px;overflow-y:auto;padding:2px}
.cartao{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.08);cursor:pointer;overflow:hidden;border-left:4px solid transparent;transition:box-shadow .15s}
.cartao:hover{box-shadow:0 4px 14px rgba(15,23,42,.12)}
.cartao.pode{cursor:grab}
.cartao.prio-urgente{border-left-color:var(--erro)}.cartao.prio-alta{border-left-color:var(--alerta)}
.cartao .capa{width:100%;height:110px;object-fit:cover;display:block}
.cartao-corpo{padding:10px 12px;display:grid;gap:6px}
.cartao-tit{font-weight:600;font-size:14px;line-height:1.3}
.cartao-meta,.cartao-pessoas,.cartao-rodape{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cartao-rodape{justify-content:space-between}
.contagens{font-size:12px;color:var(--suave)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.av-c{background:var(--sec)}.av-r{background:var(--pri)}
.fantasma{opacity:.4}
.prazo{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.prazo-ok{background:#DCFCE7;color:#166534}.prazo-proximo{background:#FEF3C7;color:#92400E}.prazo-atrasado{background:#FEE2E2;color:#991B1B}
.prazo-bloqueado{background:#E2E8F0;color:#334155}.prazo-concluido{background:#DBEAFE;color:#1E40AF}.prazo-sem{background:#F1F5F9;color:#64748B}
.cartao-topo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sel-mover{height:38px;border:1px solid var(--borda);border-radius:10px;padding:0 10px;background:#fff;max-width:100%}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.capa-grande{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.linha-tempo{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px}
.linha-tempo li{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;background:#F8FAFC;border:1px solid #EEF2F7}
.linha-tempo li.feito{background:#F0FDF4;border-color:#BBF7D0}
.linha-tempo li.feito b::before{content:"✓ ";color:var(--ok)}
.btn-grande{height:56px;width:100%;font-size:17px}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F1F5F9;cursor:pointer}
.check-item input{width:18px;height:18px;flex:none}.check-item.feito>span:first-of-type{text-decoration:line-through;color:var(--suave)}
.check-item .ajuda{margin-left:auto}
.progresso{display:block;height:6px;border-radius:999px;background:#EEF2F7;overflow:hidden;margin-top:6px}
.progresso>span{display:block;height:100%;background:var(--pri);border-radius:999px}
.progresso.grande{height:10px}
.comentarios{display:grid;gap:10px;max-height:46vh;overflow-y:auto;padding:4px 2px 10px}
.com{background:#F8FAFC;border:1px solid #EEF2F7;border-radius:12px;padding:10px 12px;max-width:92%}
.com.meu{margin-left:auto;background:#ECFEFF;border-color:#CFFAFE}
.com.interno{background:#FFFBEB;border-color:#FDE68A}.com.com-correcao{border-left:4px solid var(--erro)}
.com-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.avatar.mini{width:24px;height:24px;font-size:10px}
.form-com{border-top:1px solid var(--borda);padding-top:12px;margin-top:6px}
.form-com .linha-mini{margin:0 0 8px}
.historico{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.historico li{display:grid;grid-template-columns:140px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #F1F5F9;align-items:center}
.lista-prod{display:grid;gap:8px}
.item-prod-txt{display:flex;flex-direction:column;flex:1;min-width:0}

/* Radar e painel */
.radar-topo{margin-bottom:16px}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.kpis>div{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;min-width:120px;display:flex;flex-direction:column}
.kpis b{font-size:24px}.kpis span{font-size:12px;color:#C8D6EA}
.kpis .alerta{background:rgba(220,38,38,.3)}
.grade-radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.bloco-radar h3{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bloco-alerta{border-color:#FECACA}
.lista-radar{display:grid;gap:8px;max-height:360px;overflow-y:auto}
.item-radar-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.item-radar,.item-prod,.item-sol{min-width:0}
.item-radar-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hora-grande{font-weight:700;font-size:15px;color:var(--sec);min-width:52px;text-align:center}
.barra-h{display:grid;grid-template-columns:180px 1fr 32px;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.barra-h .rot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilho{height:12px;background:#EEF2F7;border-radius:999px;overflow:hidden}.trilho>span{display:block;height:100%;border-radius:999px}
.colunas-dia{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--borda)}
.colunas-dia span{flex:1;height:100%;display:flex;align-items:flex-end}
.colunas-dia i{display:block;width:100%;background:var(--pri);border-radius:3px 3px 0 0;min-height:1px}
.eixo{display:flex;justify-content:space-between;font-size:11px;color:var(--suave);margin-top:4px}

@media (max-width:1100px){.agenda-layout{grid-template-columns:1fr}}
@media (max-width:860px){
  .duas-col{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:8px}
  .kanban{grid-auto-columns:86vw}
  .coluna{max-height:none}
  .janela-fundo{padding:0}.janela{border-radius:0;min-height:100%}
  .janela-topo{border-radius:0}
  .historico li{grid-template-columns:1fr}
  .grade-2,.grade-radar{grid-template-columns:minmax(0,1fr)}
  .barra-h{grid-template-columns:120px 1fr 28px}
  .titulo-periodo{min-width:0;width:100%;order:-1}
}

/* ---------- Celular ---------- */
@media (max-width:860px){
  .acesso{grid-template-columns:1fr}
  .acesso-marca{padding:28px 24px}
  .acesso-marca h1{font-size:28px}
  .lista-recursos,.rodape-marca{display:none}
  .casca{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .lateral.aberta{transform:none;box-shadow:0 0 0 100vmax rgba(10,22,40,.45)}
  .menu-cel{display:inline-flex;background:none;border:0;font-size:22px;cursor:pointer;padding:6px;margin-right:6px}
  .topo{padding:0 14px}
  .conteudo{padding:16px}
  .linha-form{grid-template-columns:1fr}
  .empresa-tag span.nome{display:none}
}

/* ---------- Identidade MPI (Innovar) ---------- */
.logo-login{width:260px;max-width:70%;height:auto;display:block}
.etiqueta-mpi{display:inline-block;font-weight:700;letter-spacing:.18em;font-size:13px;padding:5px 12px;border:1px solid rgba(255,255,255,.45);border-radius:999px;margin-bottom:16px;color:#fff}
.selo-mpi{flex-direction:column;align-items:flex-start;gap:8px;padding:6px 8px 20px!important}
.selo-mpi .logo-empresa{width:170px;max-width:100%;height:auto}
.selo-mpi .sigla{font-weight:700;letter-spacing:.14em;font-size:13px;color:#fff}
.selo-mpi .sigla small{display:inline;letter-spacing:.02em;font-weight:500;color:#9FB3D9;font-size:12px;margin-left:4px}
.nav-item.js-instalar{color:#9DB8FF}
@media (max-width:860px){.logo-login{width:180px}.acesso-marca .etiqueta-mpi{margin-bottom:10px}}
.pessoa{display:flex;align-items:center;gap:10px}
a.item-radar{text-decoration:none;color:inherit}

/* Portais de entrada por categoria */
.pedir-acesso{margin-top:18px;padding:12px 14px;border-radius:10px;background:#EFF6FF;color:#1E40AF;font-size:14px;text-align:center}
.pedir-acesso button{background:none;border:0;color:var(--sec);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.portal-criador .acesso-marca{background:radial-gradient(1000px 560px at -10% -20%,#3B4A6B 0,transparent 60%),linear-gradient(160deg,#141B2D,#05070D)}
.portal-direcao .acesso-marca{background:radial-gradient(1000px 560px at -10% -20%,#1F5BE0 0,transparent 60%),linear-gradient(160deg,#0A1E57,#050E2B)}
.portal-marketing .acesso-marca{background:radial-gradient(1000px 560px at -10% -20%,#2F7BF5 0,transparent 60%),linear-gradient(160deg,#1446C8,#0E37A0)}
.portal-corretor .acesso-marca{background:radial-gradient(1000px 560px at -10% -20%,#3E8BFF 0,transparent 60%),linear-gradient(160deg,#1A5AE0,#0A1E57)}
.lista-links{display:grid;gap:10px}
.link-acesso{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--borda);border-radius:10px;background:#F8FAFC}
.link-acesso div{min-width:0;display:flex;flex-direction:column}
.link-acesso span{font-size:13px;color:var(--suave);overflow-wrap:anywhere}
#form-mkt{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
</style>
